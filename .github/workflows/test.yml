name: Test GWAS Platform

on:
  pull_request:
  push:
    branches: ["**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Install system bioinformatics tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bcftools libgomp1 unzip
          # Sama persis dengan backend/Dockerfile (PLINK 1.9 20260913, PLINK 2 20261107, GEMMA 0.98.5)
          wget -q "https://s3.amazonaws.com/plink1-assets/plink_linux_x86_64_20260913.zip" -O /tmp/plink.zip
          echo "cafa2752e2ea9a69d3a7668be4e2cdc6522095645121d2ac2787866f99a3147f  /tmp/plink.zip" | sha256sum -c -
          sudo unzip -o -q /tmp/plink.zip plink -d /usr/local/bin
          sudo chmod +x /usr/local/bin/plink
          wget -q "https://s3.amazonaws.com/plink2-assets/beta1/plink2_linux_x86_64_20261107.zip" -O /tmp/plink2.zip
          echo "16b5cf92faed7e8b8aa1010c6eab9bac17c92b57ccfa69c4d059b1b17b98eb70  /tmp/plink2.zip" | sha256sum -c -
          sudo unzip -o -q /tmp/plink2.zip plink2 -d /usr/local/bin
          sudo chmod +x /usr/local/bin/plink2
          wget -q "https://github.com/genetics-statistics/GEMMA/releases/download/v0.98.5/gemma-0.98.5-linux-static-AMD64.gz" -O /tmp/gemma.gz
          echo "bd4abd32433a660f7dda929e703f7f5d4fcbfc7c9330b66e287fb53013feb59d  /tmp/gemma.gz" | sha256sum -c -
          gunzip -c /tmp/gemma.gz | sudo tee /usr/local/bin/gemma > /dev/null
          sudo chmod +x /usr/local/bin/gemma
          plink2 --version
          plink --version
          gemma -h 2>&1 | head -3 || true

      - name: Audit backend dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: Lint backend
        run: flake8 app tests --ignore=E501,E402,W503 --max-line-length=120

      - name: Run backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          JWT_SECRET_KEY: ci-only-test-secret
        run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend tests
        run: npm test -- --runInBand

      - name: Build frontend
        run: npm run build
