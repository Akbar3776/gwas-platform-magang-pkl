worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # GFF3 hingga 95 MB dalam satu request; VCF tetap di-chunk.
    client_max_body_size 100m;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # JSON Manhattan/QQ Plot dan asset frontend biasanya sangat kompresibel.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/plain;

    upstream fastapi_backend {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        location = /health {
            access_log off;
            proxy_pass http://fastapi_backend/health;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        root /usr/share/nginx/html;
        index index.html;

        # React Router fallback untuk route seperti /upload dan /jobs/:id.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # FastAPI sudah memakai prefix /api/v1; URI dipertahankan.
        location /api/ {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
        }

        # Disiapkan untuk progress WebSocket bila endpoint WS diaktifkan.
        location /ws/ {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location = /health {
            access_log off;
            proxy_pass http://fastapi_backend/health;
        }
    }
}
